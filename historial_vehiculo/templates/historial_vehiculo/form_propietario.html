{% extends "base.html" %}
{% block title %}Nuevo Propietario{% endblock %}
{% block nav_historial %}active{% endblock %}
{% block page_title %}Registrar Propietario Anterior{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{% url 'lista_historial' %}">Historial</a><span>›</span><span>Propietario</span></div>
<div class="card" style="max-width:560px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group"><label class="form-label">Vehículo *</label>
        <select name="vehiculo" class="form-control" required>
          <option value="">Seleccionar...</option>
          {% for v in vehiculos %}<option value="{{ v.pk }}">{{ v }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Nombre del Propietario *</label><input type="text" name="nombre" class="form-control" required></div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Fecha Inicio *</label><input type="date" name="fecha_inicio" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Fecha Fin *</label><input type="date" name="fecha_fin" class="form-control" required></div>
      </div>
      <div style="display:flex;gap:12px;">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'lista_historial' %}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
