{% extends "base.html" %}
{% block title %}Eliminar{% endblock %}
{% block page_title %}Confirmar Eliminación{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-body" style="text-align:center;padding:40px;">
    <svg width="48" height="48" fill="none" stroke="#e05252" viewBox="0 0 24 24" style="margin-bottom:16px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;margin-bottom:8px;">¿Eliminar {{ tipo }}?</h3>
    <p style="color:var(--texto-suave);margin-bottom:28px;"><strong>{{ objeto }}</strong></p>
    <form method="post" style="display:flex;gap:12px;justify-content:center;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
      <a href="javascript:history.back()" class="btn btn-outline">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
