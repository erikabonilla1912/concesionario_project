{% extends "base.html" %}
{% block title %}{{ accion }} Cliente{% endblock %}
{% block nav_clientes %}active{% endblock %}
{% block page_title %}{{ accion }} Cliente{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{% url 'lista_clientes' %}">Clientes</a><span>›</span><span>{{ accion }}</span></div>
<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Nombre *</label><input type="text" name="nombre" class="form-control" value="{{ cliente.nombre|default:'' }}" required></div>
        <div class="form-group"><label class="form-label">Apellido *</label><input type="text" name="apellido" class="form-control" value="{{ cliente.apellido|default:'' }}" required></div>
        <div class="form-group"><label class="form-label">Cédula *</label><input type="text" name="cedula" class="form-control" value="{{ cliente.cedula|default:'' }}" required></div>
        <div class="form-group"><label class="form-label">Teléfono *</label><input type="text" name="telefono" class="form-control" value="{{ cliente.telefono|default:'' }}" required></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ cliente.email|default:'' }}"></div>
      </div>
      <div class="form-group"><label class="form-label">Dirección</label><textarea name="direccion" class="form-control" rows="2">{{ cliente.direccion|default:'' }}</textarea></div>
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'lista_clientes' %}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
