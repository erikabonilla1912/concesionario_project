<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoElite — Iniciar Sesión</title>
{% load static %}
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<style>
body { margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--negro); }
.bg-pattern {
  position:fixed; inset:0; z-index:0;
  background-image: radial-gradient(circle at 25% 25%, rgba(201,169,110,0.04) 0%, transparent 50%),
                    radial-gradient(circle at 75% 75%, rgba(91,141,238,0.03) 0%, transparent 50%);
}
.login-wrap { position:relative; z-index:1; }
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <h1>AutoElite</h1>
      <p>Sistema de Gestión Automotriz</p>
    </div>

    {% if form.errors %}
    <div style="background:rgba(224,82,82,0.1);border:1px solid rgba(224,82,82,0.2);color:#e05252;padding:12px 16px;border-radius:8px;font-size:0.85rem;margin-bottom:20px;">
      Usuario o contraseña incorrectos.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">
        Ingresar al Sistema
      </button>
    </form>
  </div>
</div>
</body>
</html>
